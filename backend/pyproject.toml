[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short -q --cov=app --cov-report=term-missing --no-cov-on-fail"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
